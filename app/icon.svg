<!--
  Browser-tab icon. This is the same artwork as `CrestMark` in
  components/Crest.js — if one changes, change the other.
  Padded slightly and with heavier strokes so it survives being drawn at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -2 54 60">
  <defs>
    <clipPath id="s">
      <path d="M24 2 44 8v22c0 12-10 20-20 24C14 50 4 42 4 30V8z" />
    </clipPath>
  </defs>

  <!-- Shield body -->
  <path d="M24 2 44 8v22c0 12-10 20-20 24C14 50 4 42 4 30V8z" fill="#14284b" />

  <g clip-path="url(#s)">
    <!-- Cream quarters, top-left and bottom-right -->
    <rect x="0" y="0" width="24" height="27" fill="#f8f6f0" />
    <rect x="24" y="27" width="24" height="29" fill="#f8f6f0" />

    <!-- Top-left: open book -->
    <g transform="translate(9 9)">
      <path d="M0 6.5 6 4.6v7.2L0 13.6z" fill="#14284b" />
      <path d="M12.6 6.5 6.6 4.6v7.2l6 1.8z" fill="#1e3a63" />
      <path d="M6.3 4.4v7.6" stroke="#c9a34a" stroke-width="1" />
    </g>

    <!-- Top-right: globe -->
    <g transform="translate(30 9)" stroke="#f8f6f0" stroke-width="1.2" fill="none">
      <circle cx="6" cy="8" r="6.2" />
      <path d="M-0.2 8h12.4" />
      <path d="M6 1.8c3 3.4 3 8.8 0 12.4-3-3.6-3-9 0-12.4z" />
    </g>

    <!-- Bottom-left: candle -->
    <g transform="translate(11 31)">
      <rect x="4.4" y="4.6" width="2.6" height="8.4" rx="0.7" fill="#14284b" />
      <rect x="1.8" y="12.6" width="7.8" height="1.7" rx="0.8" fill="#1e3a63" />
      <path d="M5.7 0.6c1.5 1.5 1.9 2.6 1.2 3.4-.7.8-2 .7-2.5-.2-.5-.9 0-2 1.3-3.2z" fill="#c9a34a" />
    </g>

    <!-- Bottom-right: laptop with graduation cap -->
    <g transform="translate(29 32)">
      <rect x="1.4" y="3.4" width="10.4" height="7" rx="1" fill="none" stroke="#f8f6f0" stroke-width="1.2" />
      <path d="M0 11.6h13.2l1.2 1.9H-1.2z" fill="#f8f6f0" />
      <path d="M2.9 6.4 6.6 5l3.7 1.4L6.6 7.8z" fill="#c9a34a" />
    </g>
  </g>

  <!-- Central monogram -->
  <circle cx="24" cy="27" r="8.8" fill="#f8f6f0" stroke="#c9a34a" stroke-width="2" />
  <text x="24" y="31.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14284b"
        font-family="Georgia, 'Times New Roman', serif">E</text>

  <!-- Gold shield border -->
  <path d="M24 2 44 8v22c0 12-10 20-20 24C14 50 4 42 4 30V8z" fill="none" stroke="#c9a34a" stroke-width="2.6" />
</svg>
